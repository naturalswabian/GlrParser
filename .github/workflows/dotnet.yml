# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "release/*.*.*" ]
#   pull_request:
#     branches: [ "develop", "main" ]

#on:
#  push:
#  pull_request:
    
jobs:
  build:

    permissions:      
      id-token: write # Enable GitHub OIDC token issuance for this job (needed for NuGet push).
      contents: read

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Restore dependencies
      run: dotnet restore

    # todo: Add sanity check for version match.

    # Release Build
    - name: Release Build
      if: "startsWith(github.ref, 'refs/tags/')"
      run: dotnet build --no-restore

    # Regular Build
    - name: Build
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: dotnet build --no-restore -p:VersionSuffix="${{github.ref_name}}.${{github.run_number}}"

    - name: Test
      run: dotnet test --no-build --verbosity normal

    # Get a short-lived NuGet API key.
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USER}}
  
    # Push the package.
    - name: NuGet push
      run: dotnet nuget push "Sources/Packages/GlrParser*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate     
